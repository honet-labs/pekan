name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

env:
  GO_VERSION: '1.23'
  NODE_VERSION: '20'

jobs:
  backend-lint:
    name: Backend Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Go Vet
        run: go vet ./...
        working-directory: backend

      - name: Go Format Check
        run: |
          if [ "$(gofmt -l . | wc:: -l)" -gt 0 ]; then
            gofmt -l .
            exit 1
          fi
        working-directory: backend

  backend-test:
    name: Backend Test
    runs-on: ubuntu-latest
    needs: backend-lint
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: pekan_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d pekan_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: backend/go.sum

      - name: Run Tests
        run: go test ./... -v -coverprofile=coverage.out -timeout 120s
        working-directory: backend
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/pekan_test?sslmode=disable
          JWT_SECRET: test-secret-at-least-32-characters-long
          APP_ENV: development

      - name: Upload Coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage.out

  backend-build:
    name: Backend Build
    runs-on: ubuntu-latest
    needs: backend-test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: backend/go.sum

      - name: Build API Binary
        run: CGO_ENABLED=0 go build -o /dev/null ./cmd/api/main.go
        working-directory: backend

      - name: Build Worker Binary
        run: CGO_ENABLED=0 go build -o /dev/null ./cmd/worker/main.go
        working-directory: backend

      - name: Build AI Binary
        run: CGO_ENABLED=0 go build -o /dev/null ./cmd/ai/main.go
        working-directory: backend

  frontend-lint:
    name: Frontend Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        run: npm ci
        working-directory: frontend

      - name: TypeScript Check
        run: npx tsc --noEmit
        working-directory: frontend

  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest
    needs: frontend-lint
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        run: npm ci
        working-directory: frontend

      - name: Build
        run: npm run build
        working-directory: frontend

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist

  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [backend-build, frontend-build]
    steps:
      - uses: actions/checkout@v4

      - name: Build Backend Image
        run: docker build -t pekan-backend:test ./backend

      - name: Build Frontend Image
        run: docker build -t pekan-frontend:test ./frontend

      - name: Verify Backend Image
        run: docker run --rm pekan-backend:test /app/pekan-api --help || true

      - name: Verify Frontend Image
        run: docker run --rm pekan-frontend:test nginx -t
